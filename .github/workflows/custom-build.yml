name: FlClash Custom Windows + Android

on:
  push:
    branches:
      - feature/smart-select-v1
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  android-debug:
    name: Android arm64 APK (test build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - name: Flutter dependencies
        run: flutter pub get
      - name: Format and test new feature
        run: |
          dart format lib/features/smart_select test/smart_select_test.dart
          flutter test test/smart_select_test.dart
      - name: Build installable debug APK (separate .dev package)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-Custom-Android-debug
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows:
    name: Windows EXE + portable ZIP
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
      - name: Format and test new feature
        run: |
          dart format lib/features/smart_select test/smart_select_test.dart
          flutter test test/smart_select_test.dart
      - name: Build Windows packages
        run: dart setup.dart windows --targets exe,zip --env dev -v
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-Custom-Windows
          path: dist/*
          if-no-files-found: error
