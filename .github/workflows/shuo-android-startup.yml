name: SHUO Android v1.0.2 startup hotfix

on:
  push:
    branches:
      - hotfix/android-startup-v1.0.2
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  verify:
    name: Verify Firebase-free startup and Flutter/Android channels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - run: flutter pub get
      - name: Test Android channel contract and smart select version
        run: flutter test test/android_method_channel_contract_test.dart test/android_startup_no_firebase_test.dart test/smart_select_test.dart test/smart_select_version_test.dart
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile Kotlin plugins and test their channel contract
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

  android-release:
    name: Build & verify permanently signed Android v1.0.2 APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Restore permanent signing key (never generate new keys)
        shell: bash
        env:
          SHUO_SIGNING_PASSWORD: ${{ secrets.SHUO_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -s android/signing/shuo-release.jks.enc
          test -n "$SHUO_SIGNING_PASSWORD"
          python3 -m pip install --user 'cryptography>=43,<48'
          python3 scripts/shuo_signing.py restore --properties android/local.properties
      - name: Build permanently signed arm64 Release APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify package identity, higher version, valid signature and SAME certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APK_SIGNER" && test -n "$AAPT"
          "$APK_SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com[.]shuowang[.]flclash[.]custom' versionCode='10002' versionName='1[.]0[.]2'"
          EXPECTED='3e8826e8aa48576ddfce7a9a2e78106a159c7be05dbb3b2f89eb60fb095ac9d9'
          CERT_INFO="$("$APK_SIGNER" verify --print-certs "$APK")"
          ACTUAL="$(printf '%s\n' "$CERT_INFO" | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F]{64}).*/\1/p' | tr '[:upper:]' '[:lower:]' | head -n 1)"
          echo "Expected v1.0.0 public certificate digest: $EXPECTED"
          echo "New v1.0.2 public certificate digest: ${ACTUAL:-not found}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK certificate verification mismatch. Signing material was not changed; inspect public certificate digests."
            printf '%s\n' "$CERT_INFO" | grep -i "certificate SHA-256" || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/FlClash-SHUO-Custom-v1.0.2-android-arm64.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-SHUO-Android-v1.0.2-FIXED-SIGNED
          path: dist/*
          if-no-files-found: error
      - name: Delete plaintext signing key from workspace
        if: always()
        shell: bash
        run: rm -f android/app/keystore.jks

  publish:
    name: Publish Android v1.0.2 fix without changing Windows v1.0.0
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [verify, android-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FlClash-SHUO-Android-v1.0.2-FIXED-SIGNED
          path: dist
      - name: Publish v1.0.2 Android repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.0.2 dist/* --repo "${{ github.repository }}" \
            --title "FlClash SHUO Custom v1.0.2 — Android 启动修复验证版" \
            --prerelease \
            --notes "Android 原生闪退修复：移除 SHUO 独立包名后遗留的 Firebase 初始化（它可能导致启动服务时崩溃）；保留 v1.0.1 的 MethodChannel 修复。Android 包名与固定签名不变，版本码从 10001 更新到 10002，可覆盖安装 Android v1.0.1，无需卸载或清空配置。Windows v1.0.0 已正常，无须更新：https://github.com/shuowang0217/FlClash-Custom/releases/tag/v1.0.0 。智能优选功能版本保持 v1.0.0。本版经过 Dart 通道回归、Firebase-free 启动检查、Kotlin 单元测试、Android release 构建及证书 SHA-256 一致性校验。此前 v1.0.1 在部分手机上同意免责声明后闪退；v1.0.2 仍需用户实际安装验证，因此暂标记预发布。"
