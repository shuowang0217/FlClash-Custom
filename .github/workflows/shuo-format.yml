name: SHUO source-format normalization
on:
  push:
    branches:
      - release/shuo-v1.0.0
permissions:
  contents: write
jobs:
  normalize:
    name: Persist canonical Dart formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: master
          cache: true
      - name: Format source
        run: dart format lib test tool plugins setup.dart
      - name: Save formatting when needed
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib test tool plugins setup.dart
            git commit -m 'style: normalize SHUO release Dart formatting'
            git push origin HEAD:release/shuo-v1.0.0
          fi
