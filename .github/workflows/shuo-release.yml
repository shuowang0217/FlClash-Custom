name: SHUO Custom — Windows + Android release candidate

on:
  push:
    branches:
      - release/shuo-v1.0.0
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish manually if desired (main branch release is automatic after signing is configured)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  verify:
    name: Verify source and feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
      - name: Verify Dart source formatting
        run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart
      - name: Smart-select tests
        run: flutter test test/smart_select_test.dart test/smart_select_version_test.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cloud Android signing encrypt/decrypt self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user 'cryptography>=43,<48'
          export SHUO_SIGNING_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python3 scripts/shuo_signing.py generate --encrypted "$RUNNER_TEMP/shuo-test-key.enc"
          python3 scripts/shuo_signing.py restore --encrypted "$RUNNER_TEMP/shuo-test-key.enc" --output "$RUNNER_TEMP/shuo-test.jks" --properties "$RUNNER_TEMP/shuo-local.properties"
          test -s "$RUNNER_TEMP/shuo-test.jks"
          rm -f "$RUNNER_TEMP/shuo-test-key.enc" "$RUNNER_TEMP/shuo-test.jks" "$RUNNER_TEMP/shuo-local.properties"


  windows-release:
    name: Windows SHUO release EXE and ZIP
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git config --global core.longpaths true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - run: flutter pub get
      - name: Windows release packaging
        run: dart setup.dart windows --targets exe,zip --env stable -v
      - name: Distinguishable package names
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            if ($_.Name -notlike '*SHUO*') {
              Rename-Item $_.FullName ('SHUO-Custom-v1.0.0-' + $_.Name)
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SHUO-Custom-v1.0.0-Windows-release
          path: dist/*
          if-no-files-found: error

  android-preview:
    name: Android SHUO candidate (debug-signed, not final)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - run: flutter pub get
      - name: Build Android candidate
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: SHUO-Custom-v1.0.0-Android-PREVIEW-DO-NOT-PUBLISH
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  android-release:
    name: Android permanently signed SHUO APK (cloud key)
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Detect initialized permanent signing key
        id: key
        shell: bash
        env:
          SHUO_SIGNING_PASSWORD: ${{ secrets.SHUO_SIGNING_PASSWORD }}
        run: |
          if test -f android/signing/shuo-release.jks.enc && test -n "$SHUO_SIGNING_PASSWORD"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Permanent signing key is configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Permanent signing initialization is pending; unsigned release is suppressed."
          fi
      - uses: actions/setup-go@v5
        if: steps.key.outputs.available == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.available == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - uses: gradle/actions/setup-gradle@v6
        if: steps.key.outputs.available == 'true'
      - uses: nttld/setup-ndk@v1
        if: steps.key.outputs.available == 'true'
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - uses: actions/setup-java@v4
        if: steps.key.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch Flutter dependencies
        if: steps.key.outputs.available == 'true'
        run: flutter pub get
      - name: Recover previously created signing certificate (never regenerate)
        if: steps.key.outputs.available == 'true'
        env:
          SHUO_SIGNING_PASSWORD: ${{ secrets.SHUO_SIGNING_PASSWORD }}
        run: |
          python3 -m pip install --user 'cryptography>=43,<48'
          python3 scripts/shuo_signing.py restore --properties android/local.properties
      - name: Build Android SIGNED release
        if: steps.key.outputs.available == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.available == 'true'
        with:
          name: SHUO-Custom-v1.0.0-Android-RELEASE-SIGNED
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Remove signing material from runner workspace
        if: always()
        shell: bash
        run: rm -f android/app/keystore.jks

  publish:
    name: Publish stable GitHub Release
    if: ${{ github.ref == 'refs/heads/main' && needs.android-release.outputs.signed == 'true' }}
    needs: [verify, windows-release, android-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SHUO-Custom-v1.0.0-Windows-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: SHUO-Custom-v1.0.0-Android-RELEASE-SIGNED
          path: dist
      - name: Publish immutable v1.0.0 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 dist/* --repo "${{ github.repository }}" \
            --title "FlClash SHUO Custom v1.0.0" \
            --notes "SHUO 定制版。智能优选功能 v1.0.0；包含 Windows EXE/ZIP 与独立签名 Android APK；保留 FlClash GPL-3.0 许可。"
